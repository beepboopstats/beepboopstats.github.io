project:
  type: website
  output-dir: docs
  # only .qmd pages; keeps CLAUDE.md and other .md files off the site
  render:
    - "**/*.qmd"
  # pages embed their images, so copy the ones referenced by absolute URL
  # (social previews, structured data) into the published site
  resources:
    - assets/img/og-card.jpg
    - assets/img/logo.png
    - assets/img/portrait.jpg
    - favicon.ico
    - assets/img/favicons/android-chrome-192x192.png
    - assets/img/favicons/apple-touch-icon.png

execute:
  # freeze: auto
  echo: false
  warning: false
  
website:
  title: "BeepBoopStats"
  # SEO: absolute URLs for the sitemap, canonical links and social previews
  site-url: https://www.beepboopstats.com
  description: "BeepBoopStats builds websites, interactive dashboards, apps and data pipelines for research teams, and teaches R and statistics workshops."
  image: /assets/img/og-card.jpg
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  google-analytics: "G-LXSX23EQ95"
  reader-mode: false
  page-footer: © Beep Boop Stats
  # favicon links live in assets/html/head.html (website.favicon gets inlined by embed-resources)
  # top nav
  navbar:
    pinned: true
    logo: /assets/img/favicons/apple-touch-icon.png
    search: true
    left:
      - text: "Portfolio"
        file: portfolio.qmd
      - text: "About"
        file: about.qmd
      - text: "Contact"
        file: assets/contact/index.qmd
    right:
      - icon: github
        href: https://github.com/beepboopstats
        aria-label: BeepBoopStats on GitHub
    css: assets/css/styles.scss

format:
  html:
    theme: 
      light: 
        - pulse
        - assets/css/styles.scss
      dark: 
        - darkly
        - assets/css/styles.scss
        - assets/css/dark.scss
    fontsize: 1.1em
    page-layout: full
    toc: true
    toc-depth: 4
    toc-location: left
    toc-expand: 1
    embed-resources: true
    # new options
    toc_float: true
    code-overflow: wrap
    code-fold: true
    code-summary: "Show code"
    include-in-header:
      - file: assets/html/head.html

format-links: []
