<!-- Site icons as real files (data-external keeps embed-resources from inlining them),
     so Google and browsers can fetch them. Google uses a square icon of 48px or more. -->
<link rel="icon" data-external="1" href="/favicon.ico" sizes="any">
<link rel="icon" data-external="1" type="image/png" sizes="192x192" href="/assets/img/favicons/android-chrome-192x192.png">
<link rel="apple-touch-icon" data-external="1" href="/assets/img/favicons/apple-touch-icon.png">
